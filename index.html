<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALSTOM - Stock SAV</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="getData.js?v=1000006" defer></script>

  <style>
    :root {
      --blue-dark: #002b55;
      --blue: #003a70;
      --blue-light: #0070c9;
      --blue-soft: #e8f3ff;
      --bg: #f3f6fb;
      --white: #ffffff;
      --border: #d8e0ea;
      --text: #1f2937;
      --muted: #6b7280;
      --green: #dcfce7;
      --orange: #fff4d6;
      --red: #ffe1e1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #dceeff 0, transparent 32%),
        linear-gradient(135deg, #f8fbff, #eef3f9);
      color: var(--text);
    }

    input, select, button {
      width: 100%;
      padding: 9px 11px;
      margin: 5px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--blue-light);
      box-shadow: 0 0 0 3px rgba(0,112,201,0.16);
    }

    button {
      background: linear-gradient(135deg, var(--blue-light), var(--blue));
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,58,112,0.18);
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .danger-btn {
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    #login_section {
      max-width: 420px;
      margin: 90px auto;
      background: rgba(255,255,255,0.92);
      padding: 32px;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.14);
      border: 1px solid rgba(255,255,255,0.8);
    }

    #login_section h2 {
      color: var(--blue);
      margin-top: 0;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 315px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background:
        linear-gradient(180deg, rgba(0,43,85,0.98), rgba(0,58,112,0.96)),
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 35%);
      color: white;
      padding: 22px 15px;
      overflow-y: auto;
      box-shadow: 8px 0 24px rgba(0,0,0,0.14);
    }

    .sidebar-title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      padding-left: 4px;
    }

    .sidebar .panel {
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      margin-bottom: 13px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      backdrop-filter: blur(6px);
    }

    .sidebar .panel-header {
      padding: 11px 13px;
      font-weight: bold;
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      font-size: 14px;
    }

    .sidebar .panel-body {
      padding: 11px 13px;
    }

    .sidebar input,
    .sidebar select {
      background: rgba(255,255,255,0.96);
      color: var(--text);
      border: none;
    }

    .sidebar #barcode_result,
    .sidebar #affichage_stock,
    .sidebar #current_mode_text {
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      margin-bottom: 0;
      line-height: 1.4;
    }

    .mode-choice label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 13px;
    }

    .mode-choice input {
      width: auto;
      margin: 0;
      accent-color: var(--blue-light);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .main {
      padding: 24px;
      overflow-x: hidden;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
    }

    .main-header h1 {
      margin: 0;
      color: var(--blue);
      font-size: 27px;
    }

    .main-header small {
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    .logout-btn {
      width: auto;
      padding: 10px 18px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--blue-light);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: var(--blue);
    }

    .table-panel {
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .table-title {
      padding: 16px 18px;
      background: linear-gradient(90deg, #ffffff, #f1f7ff);
      border-bottom: 1px solid var(--border);
    }

    .table-title h2 {
      margin: 0;
      color: var(--blue);
      font-size: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    #product table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 900px;
    }

    #product th {
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: white;
      padding: 11px 10px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    #product th select {
      margin: 0;
      padding: 7px;
      font-size: 12px;
      border-radius: 8px;
      border: none;
    }

    #product td {
      padding: 9px 10px;
      border-bottom: 1px solid #edf2f7;
      font-size: 13px;
      vertical-align: middle;
    }

    #product tbody tr:nth-child(even) td {
      filter: brightness(0.985);
    }

    #product td select {
      margin: 0;
      padding: 7px;
      font-size: 12px;
    }

    #product tr:hover td {
      background: #eaf5ff !important;
    }

    tr.status-good td { background-color: var(--green); }
    tr.status-warning td { background-color: var(--orange); }
    tr.status-danger td { background-color: var(--red); }

    tr.status-selected td {
      outline: 2px solid var(--blue-light);
    }

    #product td button {
      width: auto;
      padding: 6px 10px;
      margin: 2px;
      border-radius: 8px;
      box-shadow: none;
    }

    @media (max-width: 1200px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div id="login_section">
    <h2>Connexion</h2>

    <input id="login_email" type="email" placeholder="Email">
    <input id="login_password" type="password" placeholder="Mot de passe">

    <button onclick="login()">Connexion</button>

    <p id="login_error" style="display:none; color:red;">
      Erreur login
    </p>
  </div>

  <div id="inventory_section" style="display:none;">

    <div class="app-layout">

      <aside class="sidebar">

        <div class="sidebar-title">ALSTOM</div>

        <div class="panel">
          <div class="panel-header">Mode</div>
          <div class="panel-body">
            <div class="mode-choice">
              <label>
                <input type="radio" name="work_mode" value="movement" checked>
                Entrée / Sortie
              </label>

              <label>
                <input type="radio" name="work_mode" value="inventory">
                Inventaire
              </label>
            </div>

            <p id="current_mode_text">Mode actuel : Entrée / Sortie</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Scanner</div>
          <div class="panel-body">
            <input
              type="text"
              id="barcode_input"
              placeholder="Scanner ici"
              onkeydown="handleBarcodeScan(event)"
              autofocus
            >

            <p id="barcode_result">Aucun scan</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Stock</div>
          <div class="panel-body">
            <select id="productSelect">
              <option value="">-- Sélectionnez un produit --</option>
            </select>

            <input
              type="text"
              id="input_stock"
              placeholder="+5, -3, 10"
            >

            <button onclick="definirStock()">Définir</button>

            <div class="quick-actions">
              <button onclick="stock()">+1</button>
              <button onclick="retrait()">-1</button>
            </div>

            <p id="affichage_stock">stock : 0</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Ajouter</div>
          <div class="panel-body">
            <input id="new_code" placeholder="Code barre">
            <input id="new_nom" placeholder="Nom">
            <input id="new_stock" type="number" value="0">
            <input id="new_stock_min" type="number" value="1">
            <input id="new_stock_max" type="number" value="7">

            <select id="new_emplacement">
              <option value="">-- Emplacement --</option>
              <option value="Bungalow">Bungalow</option>
              <option value="Container Retrofit">Container Retrofit</option>
              <option value="Container SAV">Container SAV</option>
            </select>

            <button onclick="addProduct()">Ajouter</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Supprimer</div>
          <div class="panel-body">
            <input id="delete_code" placeholder="Code barre">
            <button class="danger-btn" onclick="deleteProduct()">Supprimer</button>
          </div>
        </div>

      </aside>

      <main class="main">

        <div class="main-header">
          <div>
            <h1>Stock SAV</h1>
            <small>Inventaire, mouvements et emplacements</small>
          </div>

          <button class="logout-btn" onclick="logout()">
            Déconnexion
          </button>
        </div>

        <section class="dashboard">
          <div class="stat-card">
            <div class="stat-label">Produits suivis</div>
            <div class="stat-value">428</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Stocks critiques</div>
            <div class="stat-value">18</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Bungalow</div>
            <div class="stat-value">146</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Container SAV</div>
            <div class="stat-value">92</div>
          </div>
        </section>

        <div class="table-panel">
          <div class="table-title">
            <h2>Inventaire des produits</h2>
          </div>

          <div class="table-wrapper">
            <div id="product"></div>
          </div>
        </div>

      </main>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://tqpmetwknggpqalbldcl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7H9yMbMXloTdt9TepGZhtQ_Tv3C55G0";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  </script>

</body>
</html>
