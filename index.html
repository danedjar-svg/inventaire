<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion de stock</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="getData.js" defer></script>

  <style>
    body { font-family: Arial; margin: 20px; }

    input, button, select {
      padding: 6px;
      margin: 5px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    td, th {
      border: 1px solid black;
      padding: 6px;
      text-align: center;
    }

    /* COULEURS */
    tr.status-good { background-color: #d9f7d9; }
    tr.status-warning { background-color: #ffe8b3; }
    tr.status-danger { background-color: #ffd0d0; }

    tr.status-selected {
      box-shadow: inset 0 0 0 2px #3aa0ff;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login_section">
  <h2>Connexion</h2>

  <input id="login_email" type="email" placeholder="Email">
  <input id="login_password" type="password" placeholder="Mot de passe">
  <button onclick="login()">Connexion</button>

  <p id="login_error" style="color:red; display:none;">Erreur login</p>
</div>

<!-- APP -->
<div id="inventory_section" style="display:none;">

  <h2>Inventaire</h2>
  <button onclick="logout()">Déconnexion</button>

  <p id="affichage_stock">stock : 0</p>

  <!-- SCANNER DOUCHETTE -->
  <h3>Scanner code-barres</h3>

  <input 
    type="text" 
    id="barcode_input"
    placeholder="Scanner ici"
    onkeydown="handleBarcodeScan(event)"
    autofocus
    style="width:300px; font-size:16px;"
  >

  <p id="barcode_result">Aucun scan</p>

  <hr>

  <!-- ACTIONS -->
  <select id="productSelect"></select>

  <input type="text" id="input_stock" placeholder="+5, -3, 10">
  <button onclick="definirStock()">Définir</button>

  <button onclick="stock()">+1</button>
  <button onclick="retrait()">-1</button>

  <hr>

  <!-- AJOUT PRODUIT -->
  <h3>Ajouter produit</h3>

  <input id="new_code" placeholder="Code barre">
  <input id="new_nom" placeholder="Nom">
  <input id="new_stock" type="number" value="0">
  <input id="new_stock_min" type="number" value="1">
  <input id="new_stock_max" type="number" value="7">

  <button onclick="addProduct()">Ajouter</button>

  <hr>

  <!-- SUPPRESSION -->
  <h3>Supprimer produit</h3>

  <input id="delete_code" placeholder="Code barre">
  <button onclick="deleteProduct()">Supprimer</button>

  <hr>

  <!-- TABLE -->
  <div id="product"></div>

</div>

<!-- CONFIG SUPABASE -->

  const SUPABASE_KEY = "sb_publishable_7H9yMbMXloTdt9TepGZhtQ_Tv3C55G0";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

</body>
</html>
