<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALSTOM - Gestion de Stock SAV</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="getData.js?v=2000002" defer></script>

  <style>

    :root {

      --blue-dark: #002b5c;
      --blue: #003b73;
      --blue-light: #005eb8;

      --bg: #f3f5f9;

      --card: #ffffff;

      --border: #e2e8f0;

      --text: #1e293b;

      --green: #dff5df;
      --orange: #fff1d6;
      --red: #ffdede;
    }

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: var(--bg);

      color: var(--text);
    }

    /* ===================== */
    /* LOGIN */
    /* ===================== */

    #login_section {

      width: 400px;

      margin: 100px auto;

      background: white;

      padding: 30px;

      border-radius: 18px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.12);
    }

    #login_section h2 {

      margin-top: 0;

      color: var(--blue);
    }

    input,
    select,
    button {

      width: 100%;

      padding: 10px 12px;

      margin: 6px 0;

      border-radius: 10px;

      border: 1px solid var(--border);

      font-size: 14px;
    }

    button {

      background:
        linear-gradient(
          135deg,
          var(--blue-light),
          var(--blue)
        );

      color: white;

      border: none;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {

      opacity: 0.95;
    }

    /* ===================== */
    /* APP */
    /* ===================== */

    .app {

      display: grid;

      grid-template-columns:
        240px 1fr;

      min-height: 100vh;
    }

    /* ===================== */
    /* SIDEBAR */
    /* ===================== */

    .sidebar {

      background: white;

      border-right:
        1px solid var(--border);

      display: flex;

      flex-direction: column;

      padding: 20px 0;

      border-top-right-radius: 24px;

      overflow: hidden;

      box-shadow:
        4px 0 18px rgba(0,0,0,0.05);
    }

    .logo {

      padding: 0 24px 24px 24px;

      border-bottom:
        1px solid var(--border);

      margin-bottom: 20px;

      font-size: 34px;

      font-weight: bold;

      color: var(--blue);
    }

    .menu {

      padding: 0 14px;

      flex: 1;
    }

    .menu-item {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px 16px;

      border-radius: 12px;

      margin-bottom: 8px;

      font-weight: 500;

      cursor: pointer;
    }

    .menu-item.active {

      background: #e8f1ff;

      color: var(--blue);

      font-weight: bold;

      border-left:
        4px solid var(--blue-light);
    }

    .menu-item:hover {

      background: #f3f7fd;
    }

    .sidebar-footer {

      padding: 20px;

      border-top:
        1px solid var(--border);

      font-size: 12px;

      color: #64748b;
    }

    /* ===================== */
    /* MAIN */
    /* ===================== */

    .main {

      padding: 0;
    }

    /* ===================== */
    /* TOPBAR */
    /* ===================== */

    .topbar {

      background:
        linear-gradient(
          90deg,
          var(--blue-dark),
          var(--blue)
        );

      color: white;

      padding: 22px 28px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      border-bottom-left-radius: 24px;
    }

    .topbar h1 {

      margin: 0;

      font-size: 28px;
    }

    .topbar-right {

      display: flex;

      align-items: center;

      gap: 18px;
    }

    .logout-btn {

      width: auto;

      padding: 10px 16px;

      background: rgba(255,255,255,0.16);

      border: 1px solid rgba(255,255,255,0.2);
    }

    /* ===================== */
    /* DASHBOARD */
    /* ===================== */

    .dashboard {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 16px;

      margin-bottom: 20px;

      padding: 0 20px;
    }

    .stat-card {

      background: white;

      border-radius: 18px;

      padding: 20px;

      border:
        1px solid var(--border);

      box-shadow:
        0 5px 16px rgba(0,0,0,0.05);
    }

    .stat-title {

      font-size: 13px;

      color: #64748b;

      margin-bottom: 8px;
    }

    .stat-value {

      font-size: 32px;

      font-weight: bold;

      color: var(--blue);
    }

    /* ===================== */
    /* CONTENT */
    /* ===================== */

    .content {

      display: grid;

      grid-template-columns:
        1fr 340px;

      gap: 18px;

      padding: 0 20px 20px 20px;
    }

    /* ===================== */
    /* TABLE CARD */
    /* ===================== */

    .card {

      background: white;

      border-radius: 18px;

      border:
        1px solid var(--border);

      box-shadow:
        0 5px 16px rgba(0,0,0,0.05);

      overflow: hidden;
    }

    .card-header {

      padding: 18px 20px;

      border-bottom:
        1px solid var(--border);

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .card-header h2 {

      margin: 0;

      font-size: 22px;

      color: var(--blue);
    }

    .search-bar {

      width: 380px;
    }

    .filters {

      display: flex;

      gap: 12px;

      padding: 16px 20px;

      border-bottom:
        1px solid var(--border);

      flex-wrap: wrap;
    }

    .filters select {

      width: auto;

      min-width: 180px;
    }

    .table-wrapper {

      overflow-x: auto;
    }

    /* ===================== */
    /* TABLE */
    /* ===================== */

    #product table {

      width: 100%;

      border-collapse: collapse;

      min-width: 1000px;
    }

    #product th {

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-light)
        );

      color: white;

      padding: 12px;

      text-align: left;

      font-size: 13px;
    }

    #product td {

      padding: 10px 12px;

      border-bottom:
        1px solid #edf2f7;

      font-size: 13px;
    }

    #product tr:hover td {

      background: #eef6ff;
    }

    #product td button {

      width: auto;

      padding: 6px 10px;

      margin: 0 2px;

      border-radius: 8px;
    }

    tr.status-good td {

      background:
        var(--green);
    }

    tr.status-warning td {

      background:
        var(--orange);
    }

    tr.status-danger td {

      background:
        var(--red);
    }

    /* ===================== */
    /* RIGHT PANEL */
    /* ===================== */

    .right-panel {

      display: flex;

      flex-direction: column;

      gap: 16px;
    }

    .side-card {

      background: white;

      border-radius: 18px;

      border:
        1px solid var(--border);

      box-shadow:
        0 5px 16px rgba(0,0,0,0.05);

      padding: 18px;
    }

    .side-card h3 {

      margin-top: 0;

      color: var(--blue);
    }

    .quick-buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    @media (max-width: 1400px) {

      .content {

        grid-template-columns: 1fr;
      }

      .dashboard {

        grid-template-columns:
          repeat(2, 1fr);
      }
    }

  </style>

</head>

<body>

  <!-- LOGIN -->
  <div id="login_section">

    <h2>Connexion</h2>

    <input
      id="login_email"
      type="email"
      placeholder="Email"
    >

    <input
      id="login_password"
      type="password"
      placeholder="Mot de passe"
    >

    <button onclick="login()">
      Connexion
    </button>

    <p
      id="login_error"
      style="display:none;color:red;"
    >
      Erreur login
    </p>

  </div>

  <!-- APP -->
  <div
    id="inventory_section"
    style="display:none;"
  >

    <div class="app">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <div class="logo">
          ALSTOM
        </div>

        <div class="menu">

          <div class="menu-item active">
            📋 Inventaire
          </div>

          <div class="menu-item">
            🔄 Entrée / Sortie
          </div>

          <div class="menu-item">
            📦 Produits
          </div>

          <div class="menu-item">
            🕒 Historique
          </div>

        </div>

        <div class="sidebar-footer">
          SAV
        </div>

      </aside>

      <!-- MAIN -->
      <main class="main">

        <!-- TOPBAR -->
        <div class="topbar">

          <div>
            <h1>Gestion de Stock SAV</h1>
          </div>

          <div class="topbar-right">

            <div>
              👤 Dalila
            </div>

            <button
              class="logout-btn"
              onclick="logout()"
            >
              Déconnexion
            </button>

          </div>

        </div>

        <!-- DASHBOARD -->
        <section class="dashboard">

          <div class="stat-card">
            <div class="stat-title">
              Produits
            </div>

            <div class="stat-value">
              428
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-title">
              Stock total
            </div>

            <div class="stat-value">
              2842
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-title">
              Critiques
            </div>

            <div class="stat-value">
              12
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-title">
              Bungalow
            </div>

            <div class="stat-value">
              220
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-title">
              SAV
            </div>

            <div class="stat-value">
              80
            </div>
          </div>

        </section>

        <!-- CONTENT -->
        <section class="content">

          <!-- TABLE -->
          <div class="card">

            <div class="card-header">

              <h2>
                Produits
              </h2>

              <input
                class="search-bar"
                placeholder="Rechercher..."
              >

            </div>

            <div class="filters">

              <select>
                <option>
                  Stock : Tous
                </option>
              </select>

              <select>
                <option>
                  Emplacement : Tous
                </option>
              </select>

            </div>

            <div class="table-wrapper">

              <div id="product"></div>

            </div>

          </div>

          <!-- RIGHT -->
          <div class="right-panel">

            <div class="side-card">

              <h3>
                Scanner
              </h3>

              <input
                type="text"
                id="barcode_input"
                placeholder="Scanner ici"
                onkeydown="handleBarcodeScan(event)"
                autofocus
              >

              <p id="barcode_result">
                Aucun scan
              </p>

            </div>

            <div class="side-card">

              <h3>
                Stock
              </h3>

              <select id="productSelect">

                <option value="">
                  -- Produit --
                </option>

              </select>

              <input
                type="text"
                id="input_stock"
                placeholder="+5, -3, 10"
              >

              <button onclick="definirStock()">
                Valider
              </button>

              <div class="quick-buttons">

                <button onclick="stock()">
                  +1
                </button>

                <button onclick="retrait()">
                  -1
                </button>

              </div>

              <p id="affichage_stock">
                stock : 0
              </p>

            </div>

          </div>

        </section>

      </main>

    </div>

  </div>

  <!-- SUPABASE -->
  <script>

    const SUPABASE_URL =
      "https://tqpmetwknggpqalbldcl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_7H9yMbMXloTdt9TepGZhtQ_Tv3C55G0";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  </script>

</body>

</html>
