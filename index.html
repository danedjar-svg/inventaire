<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Gestion de stock</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="getData.js?v=999999" defer></script>

  <style>
    body { font-family: Arial; margin: 20px; background: #f5f5f5; }
    input, button, select { padding: 6px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    table { border-collapse: collapse; width: 100%; background: white; margin-top: 15px; }
    td, th { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eaeaea; }

    tr.status-good { background-color: #d9f7d9; }
    tr.status-warning { background-color: #ffe8b3; }
    tr.status-danger { background-color: #ffd0d0; }
    tr.status-selected { box-shadow: inset 0 0 0 2px #3aa0ff; }

    #barcode_input { width: 320px; font-size: 16px; }

    .mode-box {
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <div id="login_section">
    <h2>Connexion</h2>

    <input id="login_email" type="email" placeholder="Email">
    <input id="login_password" type="password" placeholder="Mot de passe">
    <button onclick="login()">Connexion</button>

    <p id="login_error" style="color:red; display:none;">Erreur login</p>
  </div>

  <div id="inventory_section" style="display:none;">

    <h2>Inventaire</h2>
    <button onclick="logout()">Déconnexion</button>

    <div class="mode-box">
      <strong>Mode de travail :</strong>

      <label>
        <input type="radio" name="work_mode" value="movement" checked>
        Entrée / Sortie
      </label>

      <label>
        <input type="radio" name="work_mode" value="inventory">
        Inventaire
      </label>

      <p id="current_mode_text">Mode actuel : Entrée / Sortie</p>
    </div>

    <p id="affichage_stock">stock : 0</p>

    <h3>Scanner code-barres</h3>

    <input
      type="text"
      id="barcode_input"
      placeholder="Scanner ici"
      onkeydown="handleBarcodeScan(event)"
      autofocus
    >

    <p id="barcode_result">Aucun scan</p>

    <hr>

    <select id="productSelect">
      <option value="">-- Sélectionnez un produit --</option>
    </select>

    <input type="text" id="input_stock" placeholder="+5, -3, 10">

    <button onclick="definirStock()">Définir</button>
    <button onclick="stock()">+1</button>
    <button onclick="retrait()">-1</button>

    <hr>

    <h3>Ajouter produit</h3>

    <input id="new_code" placeholder="Code barre">
    <input id="new_nom" placeholder="Nom">
    <input id="new_stock" type="number" value="0">
    <input id="new_stock_min" type="number" value="1">
    <input id="new_stock_max" type="number" value="7">

    <select id="new_emplacement">
      <option value="">-- Emplacement --</option>
      <option value="Bungalow">Bungalow</option>
      <option value="Container Retrofit">Container Retrofit</option>
      <option value="Container SAV">Container SAV</option>
    </select>

    <button onclick="addProduct()">Ajouter</button>

    <hr>

    <h3>Supprimer produit</h3>

    <input id="delete_code" placeholder="Code barre">
    <button onclick="deleteProduct()">Supprimer</button>

    <hr>

    <div id="product"></div>

  </div>

  <script>
    const SUPABASE_URL = "https://tqpmetwknggpqalbldcl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7H9yMbMXloTdt9TepGZhtQ_Tv3C55G0";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  </script>

</body>
</html>
